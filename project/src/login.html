<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SaveOcean</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to bottom, #05d3f8, #0f4571, #2d5a9e, #4a6fb5, #5b3a9d, #4a148c, #311b92);
            min-height: 100vh;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            margin: 0;
            font-size: 2rem;
        }
        
        nav {
            display: flex;
            gap: 40px;
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: opacity 0.3s;
            font-weight: 500;
        }
        
        nav a:hover {
            opacity: 0.8;
        }
        
        hr {
            border: none;
            border-top: 3px solid #05d3f8;
        }
        
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
        }
        
        .login-box h2 {
            font-family: 'Poppins', sans-serif;
            color: #0f4571;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #0f4571;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #05d3f8;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Roboto', sans-serif;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #0f4571;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #05d3f8, #0f4571);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: transform 0.3s;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
        }
        
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
        
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        footer {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 30px;
            text-align: center;
        }
        
        .copyright {
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-water"></i> SaveOcean</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="admin.html">Admin</a>
            <a href="formulario-agua.html">Condições da Água</a>
        </nav>
    </header>
    <hr>
    
    <div class="login-container">
        <div class="login-box">
            <h2><i class="fas fa-user-lock"></i> Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                </div>
                
                <button type="submit" class="submit-btn">Entrar</button>
                
                <div id="message" class="message"></div>
            </form>
        </div>
    </div>
    
    <footer>
        <div class="copyright">
            <p>&copy; 2025 SaveOcean. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            
            // Simulação simples de login
            if (username && password) {
                messageEl.textContent = 'Login realizado com sucesso! Redirecionando...';
                messageEl.className = 'message success';
                messageEl.style.display = 'block';
                
                // Armazenar sessão
                sessionStorage.setItem('userLoggedIn', 'true');
                sessionStorage.setItem('username', username);
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);
            } else {
                messageEl.textContent = 'Por favor, preencha todos os campos.';
                messageEl.className = 'message error';
                messageEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
