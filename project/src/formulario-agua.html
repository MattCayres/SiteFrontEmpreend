<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições da Água - SaveOcean</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to bottom, #05d3f8, #0f4571, #2d5a9e, #4a6fb5, #5b3a9d, #4a148c, #311b92);
            min-height: 100vh;
            color: #333;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            margin: 0;
            font-size: 2rem;
        }
        
        nav {
            display: flex;
            gap: 40px;
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: opacity 0.3s;
            font-weight: 500;
        }
        
        nav a:hover {
            opacity: 0.8;
        }
        
        hr {
            border: none;
            border-top: 3px solid #05d3f8;
        }
        
        .form-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .form-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        
        .form-section h2 {
            font-family: 'Poppins', sans-serif;
            color: #0f4571;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #0f4571;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #05d3f8;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Roboto', sans-serif;
            transition: border-color 0.3s;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0f4571;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #05d3f8, #0f4571);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: transform 0.3s;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        footer {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 30px;
            margin-top: 60px;
            text-align: center;
        }
        
        .copyright {
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-water"></i> SaveOcean</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="admin.html">Admin</a>
            <a href="formulario-agua.html">Condições da Água</a>
        </nav>
    </header>
    <hr>
    
    <div class="form-container">
        <div class="form-section">
            <h2><i class="fas fa-tint"></i> Relatar Condições da Água</h2>
            <form id="waterForm">
                <div class="form-group">
                    <label for="location">Localização</label>
                    <input type="text" id="location" name="location" required placeholder="Cidade, Estado ou coordenadas">
                </div>
                
                <div class="form-group">
                    <label for="waterQuality">Qualidade da Água</label>
                    <select id="waterQuality" name="waterQuality" required>
                        <option value="">Selecione...</option>
                        <option value="excellent">Excelente</option>
                        <option value="good">Boa</option>
                        <option value="moderate">Moderada</option>
                        <option value="poor">Ruim</option>
                        <option value="critical">Crítica</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="temperature">Temperatura (°C)</label>
                    <input type="number" id="temperature" name="temperature" step="0.1" placeholder="Ex: 25.5">
                </div>
                
                <div class="form-group">
                    <label for="pollution">Nível de Poluição</label>
                    <select id="pollution" name="pollution" required>
                        <option value="">Selecione...</option>
                        <option value="none">Nenhuma</option>
                        <option value="low">Baixo</option>
                        <option value="medium">Médio</option>
                        <option value="high">Alto</option>
                        <option value="severe">Severo</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="wildlife">Vida Marinha Observada</label>
                    <input type="text" id="wildlife" name="wildlife" placeholder="Ex: Peixes, tartarugas, corais">
                </div>
                
                <div class="form-group">
                    <label for="observations">Observações Adicionais</label>
                    <textarea id="observations" name="observations" placeholder="Descreva o que você observou..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="reporterName">Seu Nome</label>
                    <input type="text" id="reporterName" name="reporterName" required placeholder="Seu nome completo">
                </div>
                
                <div class="form-group">
                    <label for="reporterEmail">Seu E-mail</label>
                    <input type="email" id="reporterEmail" name="reporterEmail" required placeholder="seu@email.com">
                </div>
                
                <button type="submit" class="submit-btn">Enviar Relatório</button>
                
                <div id="message" class="message"></div>
            </form>
        </div>
    </div>
    
    <footer>
        <div class="copyright">
            <p>&copy; 2025 SaveOcean. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        document.getElementById('waterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Coletar dados do formulário
            const formData = {
                id: Date.now(),
                date: new Date().toLocaleString('pt-BR'),
                location: document.getElementById('location').value,
                waterQuality: document.getElementById('waterQuality').value,
                temperature: document.getElementById('temperature').value,
                pollution: document.getElementById('pollution').value,
                wildlife: document.getElementById('wildlife').value,
                observations: document.getElementById('observations').value,
                reporterName: document.getElementById('reporterName').value,
                reporterEmail: document.getElementById('reporterEmail').value
            };
            
            // Recuperar relatórios existentes
            let reports = JSON.parse(localStorage.getItem('waterReports')) || [];
            
            // Adicionar novo relatório
            reports.push(formData);
            
            // Salvar no Local Storage
            localStorage.setItem('waterReports', JSON.stringify(reports));
            
            // Mostrar mensagem de sucesso
            const messageEl = document.getElementById('message');
            messageEl.textContent = 'Relatório enviado com sucesso! Obrigado por contribuir com a preservação dos oceanos.';
            messageEl.className = 'message success';
            messageEl.style.display = 'block';
            
            // Limpar formulário
            document.getElementById('waterForm').reset();
            
            // Esconder mensagem após 5 segundos
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        });
    </script>
</body>
</html>
